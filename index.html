<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;--bg1:#fff6ef;--bg2:#f9dfe0;--card:rgba(255,255,255,.62);--text:#4a2230;--muted:#97616f;--accent:#d9446a;--line:rgba(217,68,106,.22);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 8%,#fbc9d2 0,transparent 42%),radial-gradient(circle at 92% 90%,#f4a0b2 0,transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
.card{background:var(--card);backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(217,68,106,.18);border:1px solid var(--line);border-radius:24px;padding:36px 24px;text-align:center;animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(34px,9vw,48px);margin:0 0 12px;color:var(--accent);line-height:1.1}
p{line-height:1.6;margin:0 0 14px}
.muted{color:var(--muted);font-size:15px}
.emoji{font-size:44px;margin-bottom:8px}
.timer{display:flex;gap:10px;justify-content:center;margin:26px 0 18px}
.unit{flex:1;max-width:90px;border:1px solid var(--line);border-radius:16px;padding:14px 4px}
.unit b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:36px;font-weight:500}
.unit span{font-size:12px;color:var(--muted)}
.hint{border-left:3px solid var(--accent);text-align:left;padding:4px 14px;margin:20px 0;font-size:15px;color:var(--muted)}
.hint i{display:block;margin-top:6px}
input{width:100%;max-width:220px;text-align:center;font-size:30px;letter-spacing:.5em;padding:12px 0 12px .5em;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);outline:none}
input:focus{border-color:var(--accent)}
button{margin-top:16px;padding:13px 32px;font-size:16px;border:0;border-radius:999px;background:linear-gradient(135deg,#f2708c,#d63d62);box-shadow:0 8px 20px rgba(217,68,106,.35);color:#fff;cursor:pointer;font-family:inherit}
.err{color:var(--accent);min-height:22px;margin-top:12px;font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.letter{text-align:left}
.letter h1{text-align:center;opacity:0;animation:rise .9s ease forwards}
.tree-svg{display:block;width:100%;max-width:300px;margin:-8px auto 6px;overflow:visible}
.br{fill:none;stroke:#6a3b2c;stroke-linecap:round;stroke-dasharray:1 2;stroke-dashoffset:1;animation:grow ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.lf{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .7s ease-out both}
@keyframes pop{0%{transform:scale(0);opacity:0}65%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
.gs{opacity:0;animation:fadein 1.2s ease forwards}
@keyframes fadein{to{opacity:.16}}
.letter p{font-size:17px;line-height:1.75;opacity:0;animation:rise .9s ease forwards}
.sign{text-align:right;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:26px;color:var(--accent)}
.heart{position:fixed;bottom:-30px;pointer-events:none;animation:float linear forwards}
@keyframes float{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <section id="wait" class="card">
    <div class="emoji">🌷</div>
    <h1>Совсем скоро…</h1>
    <p class="muted">Здесь тебя ждёт кое-что особенное. Страница откроется 8 декабря ровно в 00:00 по красноярскому времени.</p>
    <div class="timer" id="timer"></div>
  </section>

  <section id="gate" class="card hidden">
    <div class="emoji">🌹</div>
    <h1>С днём рождения!</h1>
    <p class="muted">Чтобы убедиться, что это ты, введи код из 4 цифр.</p>
    <div class="hint">Подсказка: сколько книг было в подвале у дяди Амин?<i>Амин амакининг ертуласида нечта китоб бор эди</i></div>
    <input id="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Код">
    <div><button id="go">Открыть</button></div>
    <div class="err" id="err"></div>
  </section>

  <section id="letter" class="card letter hidden">
    <div id="tree" aria-hidden="true"></div>
    <h1 id="title"></h1>
    <div id="text"></div>
    <p class="sign" id="sign"></p>
  </section>
</main>

<script>
// ===== НАСТРОЙКИ =====
var OPEN_AT = Date.parse('2026-11-08T00:00:00+07:00'); // Красноярск, UTC+7
var PIN = '5454';
var TITLE = '8 чудо света😍, девушка 12 из 10, с днём рождения!';
var PARAGRAPHS = [
  'Здесь будет твоё письмо. Первый абзац.',
  'Второй абзац с искренними словами.',
  'Третий абзац.'
];
var SIGNATURE = 'Твой фанат Жасур';
// ======================

var $ = function(id){return document.getElementById(id)};
var preview = location.hash === '#test'; // для проверки: открой страницу с #test (уведомления не шлются)
var attempts = 0;

// Уведомление тебе в VK через /api/send (ошибки молча игнорируем)
function notify(event, extra){
  if(preview) return;
  try{
    fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({event:event,extra:extra||''}),keepalive:true}).catch(function(){});
  }catch(e){}
}
var unitsRu = [['дней',86400000],['часов',3600000],['минут',60000],['секунд',1000]];

function pad(n){return n<10?'0'+n:''+n}
function show(id){['wait','gate','letter'].forEach(function(s){$(s).classList.toggle('hidden',s!==id)})}

var phase0 = Date.now() < OPEN_AT ? 'wait' : 'gate';
function tick(){
  var left = OPEN_AT - Date.now();
  if(left <= 0 || preview){
    clearInterval(iv); show('gate');
    if(phase0 === 'wait' && !preview){ phase0 = 'gate'; notify('gate'); }
    return
  }
  var html = '';
  unitsRu.forEach(function(u,i){
    var v = Math.floor(left/u[1]); left -= v*u[1];
    html += '<div class="unit"><b>'+(i===0?v:pad(v))+'</b><span>'+u[0]+'</span></div>';
  });
  $('timer').innerHTML = html;
}
var visitPhase = phase0 === 'wait' ? 'до открытия' : 'после открытия';
var iv = setInterval(tick,1000); tick();
notify('visit', visitPhase);

function hearts(){
  for(var i=0;i<24;i++){
    var h = document.createElement('div');
    h.className='heart'; h.textContent=['🌸','🌷','💗','🌹'][i%4];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(16+Math.random()*20)+'px';
    h.style.animationDuration=(4+Math.random()*4)+'s';
    h.style.animationDelay=(Math.random()*2)+'s';
    document.body.appendChild(h);
    setTimeout(function(el){el.remove()},10000,h);
  }
}

var T0 = 5.4; // когда начинает появляться текст письма (сек), после того как дерево выросло
function buildTree(){
  var cols=['#e63e78','#f0679a','#f7a3b5','#f9c9a8','#f4d06f','#d9446a'];
  // ветки: [путь, толщина, задержка, длительность]
  var br=[
    ['M150 324C148 296 152 272 150 246',9,0.2,1.2],
    ['M150 252C146 222 120 206 92 160',6,1.3,1],
    ['M150 252C154 222 180 206 208 160',6,1.3,1],
    ['M150 252C150 218 150 190 150 140',5,1.4,1],
    ['M128 212C112 190 100 150 96 100',3.5,2,0.9],
    ['M172 212C188 190 200 150 204 100',3.5,2,0.9],
    ['M96 150C100 120 112 90 118 55',2.5,2.6,0.8],
    ['M204 150C200 120 188 90 182 55',2.5,2.6,0.8],
    ['M100 176C80 160 62 140 54 108',2.5,2.6,0.8],
    ['M200 176C220 160 238 140 246 108',2.5,2.6,0.8],
    ['M150 196C138 160 130 130 128 92',2.5,2.6,0.8],
    ['M150 196C162 160 170 130 172 92',2.5,2.6,0.8]
  ];
  var s='<svg class="tree-svg" viewBox="0 0 300 335"><defs><path id="hh" d="M0 4C-7-2-7-9-3.2-9C-1.4-9 0-7.8 0-6.4C0-7.8 1.4-9 3.2-9C7-9 7-2 0 4Z"/></defs>';
  s+='<ellipse class="gs" cx="150" cy="328" rx="72" ry="6" fill="#d9446a"/>';
  br.forEach(function(b){
    s+='<path class="br" pathLength="1" d="'+b[0]+'" style="stroke-width:'+b[1]+';animation-delay:'+b[2]+'s;animation-duration:'+b[3]+'s"/>';
  });
  // листья-сердечки: случайные точки внутри формы сердца
  var pts=[],tries=0;
  while(pts.length<230 && tries<30000){
    tries++;
    var px=28+Math.random()*244, py=28+Math.random()*250;
    var x=(px-150)/105, y=(165-py)/105, a=x*x+y*y-1;
    if(a*a*a - x*x*y*y*y > 0) continue;
    var ok=true;
    for(var i=0;i<pts.length;i++){var dx=pts[i][0]-px,dy=pts[i][1]-py; if(dx*dx+dy*dy<100){ok=false;break}}
    if(ok) pts.push([px,py]);
  }
  pts.forEach(function(q,i){
    var dl = 2.7 + ((290-q[1])/260)*2.0 + Math.random()*0.5; // снизу вверх
    var sc = 1.05 + Math.random()*0.7, r = Math.round(Math.random()*50-25);
    s+='<g transform="translate('+q[0].toFixed(1)+' '+q[1].toFixed(1)+') rotate('+r+') scale('+sc.toFixed(2)+')"><use class="lf" href="#hh" fill="'+cols[i%cols.length]+'" style="animation-delay:'+dl.toFixed(2)+'s"/></g>';
  });
  $('tree').innerHTML = s+'</svg>';
}
buildTree();

function check(){
  var v = $('pin').value;
  if(v.length<4){return}
  if(v===PIN){
    $('title').textContent = TITLE;
    $('text').innerHTML = PARAGRAPHS.map(function(t,i){
      var p = document.createElement('p'); p.textContent = t;
      p.style.animationDelay = (T0+0.4+i*0.9)+'s'; return p.outerHTML;
    }).join('');
    $('sign').textContent = SIGNATURE;
    $('sign').style.animationDelay = (T0+0.4+PARAGRAPHS.length*0.9)+'s';
    $('title').style.animationDelay = (T0-0.6)+'s';
    show('letter'); window.scrollTo(0,0);
    setTimeout(hearts, (T0+0.6)*1000);
    notify('success');
  } else {
    $('err').textContent = 'Не тот код. Попробуй ещё раз 🙂';
    attempts++; notify('wrong', v + ' (попытка ' + attempts + ')');
    var g = $('gate'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
    $('pin').value=''; 
  }
}
$('go').onclick = check;
$('pin').addEventListener('input',function(){this.value=this.value.replace(/\D/g,''); $('err').textContent=''; if(this.value.length===4)check()});
$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')check()});
</script>
</body>
</html>
